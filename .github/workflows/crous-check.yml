name: Vérification logement CROUS

on:
  schedule:
    # Toutes les 10 minutes (le "cron" de GitHub peut avoir quelques minutes
    # de retard en cas de forte charge sur leurs serveurs, c'est normal)
    - cron: "*/10 * * * *"
  workflow_dispatch: # permet aussi de le lancer manuellement depuis GitHub

# Nécessaire pour que le job puisse "committer" le fichier de suivi
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          CROUS_SEARCH_URL: ${{ secrets.CROUS_SEARCH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crous_alert_bot.py

      - name: Sauvegarder la liste des logements déjà vus
        run: |
          git config user.name "crous-bot"
          git config user.email "crous-bot@users.noreply.github.com"
          if [ -f logements_deja_vus.json ]; then
            git add logements_deja_vus.json
            git diff --quiet --cached || git commit -m "Mise à jour des logements suivis"
            git push
          else
            echo "Aucun logement récupéré ce cycle, rien à sauvegarder."
          fi
